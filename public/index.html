<body class="loading">
<!-- filter tepi kasar untuk huruf PORTFOLIO -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
</svg>

<div id="loader" aria-hidden="true"><div class="ld-note"><span class="pin"></span><b>Menyiapkan catatan</b><i></i></div></div>
<div id="progress"></div>
<div id="cursor" aria-hidden="true"><span class="c-dot"></span><span class="c-ring"><em>Lihat</em></span></div>

<!-- seluruh halaman disusun oleh js/main.js dari js/data.js -->
<div id="app"></div>
<noscript><p style="padding:40px;font-family:sans-serif">Aktifkan JavaScript untuk melihat portofolio ini.</p></noscript>

<script src="js/data.js"></script>
<script src="js/thumbs.js"></script>
<script src="js/scroll-story.js"></script>
<script src="js/scroll-about.js"></script>

<script type="module" src="js/bootstrap.js"></script>
<script>
/* Cadangan: kalau index.html dibuka dengan klik dua kali (file://), browser memblokir
   bootstrap.js. Setelah 2,5 detik, tampilan dimuat langsung dari js/data.js. */
setTimeout(function(){
  if (window.__folioBoot || document.querySelector('script[src="js/main.js"]')) return;
  var s=document.createElement('script'); s.src='js/main.js'; document.body.appendChild(s);
}, 2500);
</script>

</body>
