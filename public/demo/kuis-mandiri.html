<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kuis Perkalian — Demo Mr.K</title><style>*{box-sizing:border-box}body{margin:0;background:#e8e7e3;color:#161616;font:17px/1.6 system-ui,sans-serif;display:grid;min-height:100vh;place-items:center;padding:20px}main{width:min(100%,620px);background:#f6f5f1;border:1px solid #16161644;padding:32px;box-shadow:6px 8px 0 #16161618}.note{display:inline-block;background:#f3e27a;padding:4px 12px;transform:rotate(-2deg)}h1{font-size:clamp(28px,6vw,42px);line-height:1.1}button{padding:14px 20px;font:inherit;border:1px solid #161616;background:#f3e27a;cursor:pointer;min-height:48px}button:disabled{cursor:default;opacity:.7}button:focus-visible{outline:3px solid #d4202a;outline-offset:3px}.options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.options button{background:#dce8ef}.options .correct{background:#b8dcae}.options .wrong{background:#f1bdc2}#game{margin:28px 0}.feedback{min-height:54px}footer{border-top:1px solid #16161633;padding-top:20px;font-size:13px;color:#555}a{color:inherit}
</style></head><body><main><span class="note">Contoh untuk dipelajari</span><h1>Ekspedisi Perkalian</h1><p>Lima tantangan singkat. Tidak ada batas waktu.</p><div id="game"></div><footer>Demo mandiri · Tanpa pengumpulan data · Kode demo berlisensi MIT<br><a href="https://kristantosaputra.my.id/berbagi.html?baca=membuat-kuis-html-dengan-ai">Kembali ke tutorial</a></footer></main><script>// MIT License — Copyright (c) 2026 Kristanto Saputra.
const questions=[{a:3,b:4,options:[7,12,14,16]},{a:6,b:7,options:[36,40,42,48]},{a:8,b:5,options:[13,35,40,45]},{a:9,b:4,options:[32,36,40,45]},{a:7,b:8,options:[48,54,56,64]}];
const game=document.getElementById('game');let index=0,score=0,answered=false;
function draw(){answered=false;const q=questions[index];game.innerHTML=`<p>Pos ${index+1} dari ${questions.length}</p><h2>${q.a} × ${q.b} = …</h2><div class="options">${q.options.map(n=>`<button data-answer="${n}">${n}</button>`).join('')}</div><p class="feedback" role="status" aria-live="polite"></p><button id="next" hidden>${index===questions.length-1?'Lihat hasil':'Pos berikutnya'}</button>`;
for(const button of game.querySelectorAll('[data-answer]'))button.onclick=()=>{if(answered)return;answered=true;const correct=q.a*q.b;if(+button.dataset.answer===correct)score++;for(const option of game.querySelectorAll('[data-answer]')){option.disabled=true;if(+option.dataset.answer===correct)option.classList.add('correct');}if(+button.dataset.answer!==correct)button.classList.add('wrong');game.querySelector('.feedback').textContent=(+button.dataset.answer===correct?'Benar! ':'Belum tepat. ')+`${q.a} kelompok masing-masing ${q.b} menghasilkan ${correct}.`;document.getElementById('next').hidden=false;};
document.getElementById('next').onclick=()=>{index++;if(index<questions.length)draw();else{game.innerHTML=`<h2>Ekspedisi selesai!</h2><p>Jawaban benar: ${score} dari ${questions.length}.</p><p>Ulangi untuk berlatih lagi, tanpa mengumpulkan data pribadi.</p><button id="restart">Mulai lagi</button>`;document.getElementById('restart').onclick=start;}};
}
function start(){index=0;score=0;draw();}game.innerHTML='<button id="start">Mulai ekspedisi</button>';document.getElementById('start').onclick=start;
</script></body></html>
